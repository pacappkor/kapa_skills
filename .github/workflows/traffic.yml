# Copy to .github/workflows/traffic.yml on the caller's main (default) branch.
name: Daily traffic
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  count:
    uses: pacappkor/.github/.github/workflows/traffic-count.yml@5e53464a8b02054d15146b1719d7de6f36201b34 # reviewed central commit; bump explicitly
    secrets:
      TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
